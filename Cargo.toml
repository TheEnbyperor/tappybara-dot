[package]
name = "dot-vas"
version = "0.1.0"
authors = ["Q Misell <q@magicalcodewit.ch>"]
edition = "2021"

[dependencies]
esp-hal = { version = "1.0.0-rc.0", features = [ "esp32", "unstable" ] }
esp-hal-embassy = { version = "0.9", features = [ "esp32" ] }
esp-alloc = { version = "0.8" }
embassy-executor = { version = "0.7", features = ["task-arena-size-32768"] }
embassy-time = { version = "0.4", features = ["generic-queue-8"]}
embassy-sync = "0.7"
embassy-embedded-hal = "0.4"
embedded-hal = "1.0"
embedded-hal-async = "1.0"
log = "0.4"
embassy-futures = "0.1"
iso7816-tlv = "0.4.4"
lazy_static = { version = "1.5.0", features = ["spin_no_std"] }
static_cell = "2.1.1"
ndef-rs = { version = "0.2.2", path = "../ndef-rs/ndef" }
rand_chacha = { version = "0.9.0", default-features = false }
embedded-nal-async = "0.8.0"
embassy-net = { version = "0.7.0", features = ["alloc", "medium-ethernet", "medium-ip", "proto-ipv6", "udp", "mdns", "multicast"] }
esp-wifi = { version = "0.15.0", features = ["esp32", "wifi"] }
esp-wifi-sys = { version = "0.7.1", features = ["esp32"] }
littlefs2 = { version = "0.6.1", default-features = false, features = ["alloc"] }
esp-bootloader-esp-idf = { version = "0.2.0", features = ["esp32"] }
esp-storage = { version = "0.7.0", features = ["esp32"] }
embedded-storage = "0.3.1"
heapless = "0.8.0"
rasn = { version = "0.27.1", default-features = false, features = ["bytes"] }
coap-lite = { version = "0.13.3", default-features = false }
hickory-proto = { version = "0.25.2", default-features = false }
rand = { version = "0.9.2", default-features = false }
libz-rs-sys = { version = "0.5.1", default-features = false, features = ["c-allocator"] }
zlib-rs = { version = "0.5.1", default-features = false, features = ["c-allocator"] }
ghash = "0.5.1"

[patch.crates-io]
esp-hal = { path = "target/patch/esp-hal-1.0.0-rc.0" }
radium = { path = "target/patch/radium-0.7.0" }

[profile.dev]
opt-level = 3

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 3
overflow-checks = false

[build-dependencies]
patch-crate = "0.1"
bindgen = "0.72.0"
rasn-compiler = "0.14.2"

[package.metadata.patch]
crates = ["esp-hal", "radium"]
